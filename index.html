<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#166534" />

    <title>NO MO CO. | Local Lawn Care</title>
    <!-- Naming the town here is what gets us found in local searches. -->
    <meta
      name="description"
      content="NO MO CO. — student owned lawn mowing in Appleton, WI. Local, affordable and reliable. Request a free lawn consultation in under a minute."
    />

    <!-- Tab icon. Replace public/favicon.svg to change it. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Added to the home screen on a phone, this is the app name. -->
    <meta name="apple-mobile-web-app-title" content="NO MO CO." />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!--
      How the link looks when somebody TEXTS it to a neighbor or posts it.
      This matters more than you would think — a bare link looks like spam.

      og:image needs a real photo to show a picture card. Drop a wide photo of
      a freshly cut lawn at public/og-image.jpg (1200x630 works best) and it
      starts working with no code change. Until then the card shows the title
      and description, which still looks tidy.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NO MO CO." />
    <meta property="og:title" content="NO MO CO. | Local Lawn Care" />
    <meta
      property="og:description"
      content="Student owned lawn mowing in Appleton, WI. Local, affordable, reliable. Request a free lawn consultation in under a minute."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
